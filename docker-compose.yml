name: ukuran

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ukuran}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ukuran}
      POSTGRES_DB: ${POSTGRES_DB:-ukuran}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 and later keep their data in a versioned folder under this path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
